<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="lately-yolk" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#FFD43B" />
      <stop offset="60%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#E67700" />
    </radialGradient>
    <linearGradient id="lately-egg" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F3ECE1" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#7c2d12" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Orange grid background tile with rounded corners -->
  <rect width="512" height="512" rx="96" fill="#EA6F07" />
  
  <!-- Subtle coordinate grid lines -->
  <g stroke="#D15000" stroke-width="2.5" opacity="0.65">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Hard boiled egg silhouette with shadow -->
  <g filter="url(#soft-shadow)">
    <!-- Egg white path -->
    <path d="M 256 64
             C 328 64, 396 172, 396 288
             C 396 376, 334 424, 256 424
             C 178 424, 116 376, 116 288
             C 116 172, 184 64, 256 64 Z"
          fill="url(#lately-egg)" />

    <!-- Egg yolk -->
    <circle cx="250" cy="272" r="68" fill="url(#lately-yolk)" />

    <!-- Glossy primary reflection -->
    <ellipse cx="228" cy="238" rx="18" ry="13" transform="rotate(-28 228 238)" fill="#FFFFFF" opacity="0.95" />
    
    <!-- Secondary soft specular dot -->
    <circle cx="218" cy="260" r="6" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>