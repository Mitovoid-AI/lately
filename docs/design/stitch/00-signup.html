<script>
  (function() {
    const emailToggleBtn = document.getElementById('btn-toggle-email');
    const emailForm = document.getElementById('email-signup-form');
    const tabSignIn = document.getElementById('tab-signin');
    const tabSignUp = document.getElementById('tab-signup');
    const linkSignIn = document.getElementById('link-signin');

    if (emailToggleBtn && emailForm) {
      emailToggleBtn.addEventListener('click', () => {
        emailForm.classList.toggle('hidden');
        emailForm.classList.toggle('flex');
        emailToggleBtn.classList.toggle('bg-secondary-container');
      });
    }

    function switchMode(isSignUp) {
      if (isSignUp) {
        tabSignUp.className = "flex-1 py-2 text-center rounded-full font-label-md text-label-md bg-surface-container-lowest text-on-surface font-semibold shadow-sm transition-all duration-200";
        tabSignIn.className = "flex-1 py-2 text-center rounded-full font-label-md text-label-md text-on-surface-variant transition-all duration-200";
      } else {
        tabSignIn.className = "flex-1 py-2 text-center rounded-full font-label-md text-label-md bg-surface-container-lowest text-on-surface font-semibold shadow-sm transition-all duration-200";
        tabSignUp.className = "flex-1 py-2 text-center rounded-full font-label-md text-label-md text-on-surface-variant transition-all duration-200";
      }
    }

    if (tabSignIn) {
      tabSignIn.addEventListener('click', () => switchMode(false));
    }
    if (tabSignUp) {
      tabSignUp.addEventListener('click', () => switchMode(true));
    }
    if (linkSignIn) {
      linkSignIn.addEventListener('click', (e) => {
        e.preventDefault();
        switchMode(false);
      });
    }
  })();
</script></main>
