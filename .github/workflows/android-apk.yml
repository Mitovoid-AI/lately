name: android-apk
# The debug APK for testing on a phone. It loads its JavaScript from Metro on the PC
# (shake → Settings → Debug server host → <PC IP>:8081), so code changes need no new APK;
# only native changes (a new native module, app.json native settings) do.
on:
  push:
    branches: [qa]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/app.json"
      - "frontend/app.config.js"
      - "frontend/assets/brand/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      APP_VARIANT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # android/ is generated from app.json (Continuous Native Generation), never committed.
      - run: npx expo prebuild --platform android --no-install
      # 64-bit ARM only: every current Android phone, and a quarter of the native build time.
      - run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
        working-directory: frontend/android
      - uses: actions/upload-artifact@v4
        with:
          name: lately-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
