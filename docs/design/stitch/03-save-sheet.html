</div>
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-[24px]">chat_bubble</span>
<span class="font-caption text-caption text-white/80">312</span>
</div>
<div class="flex flex-col items-center gap-1 text-[#D98A0B]">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">send</span>
<span class="font-caption text-caption text-[#D98A0B]">Share</span>
</div>
</div>
<!-- Ghosted Author Pill -->
<div class="absolute left-4 bottom-10 flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-white font-caption">
        K
      </div>
<span class="font-title-card text-title-card text-white/80">kyoto_archives</span>
</div>
</div>
<!-- Lately Native Bottom Sheet Overlay (Warm Light Theme) -->
<div class="w-full bg-[#FFFEFB] rounded-t-[24px] px-margin pt-3 pb-space-lg flex flex-col sheet-shadow relative z-10 mt-auto">
<!-- Drag Bar Handle -->
<div class="w-full flex justify-center pb-space-sm pt-1">
<div class="w-10 h-1.5 rounded-full bg-[#D8D2C7]"></div>
</div>
<!-- Header Status Block -->
<div class="flex items-start gap-space-md pt-space-xs pb-space-sm">
<div class="relative flex-shrink-0 w-11 h-11">
  <img src="https://lh3.googleusercontent.com/aida/AEtjO1XQ3oIliEnHnfDdrE5qJ_bXI0oVHV0YQ7ZWDlerh_i2mK3_VgQiwNgCfIU6QBBHhWQLf3rPZAdb18AlPBcPv3G3z02iuuMAEmfz_0Dw63N5RsMSsq9Bd-wDCF2itmjPkdkUOxh9A6lrOI7Ik0hKvogAP9A2fAUWyd99m1dub9mclufna6g_pc_27qMWKnT2zxSk9Wd0DDLeJSqPt7oPLrmrnGH-dU8mz8-qio_rD24t_cDyUaX4SHzl4p4" alt="Lately logo" class="w-11 h-11 rounded-xl shadow-sm object-cover">
  <div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-[#186c42] border-2 border-[#FFFEFB] flex items-center justify-center shadow-xs text-white">
    <span class="material-symbols-outlined text-[13px] font-bold">check</span>
  </div>
</div>
<div class="flex flex-col">
<h2 class="font-serif-title text-[24px] text-[#1C1A17] font-semibold leading-tight">
          Saved to Lately
        </h2>
<p class="font-body-md text-meta-sm text-[#6B655D] pt-0.5">
          Your card will be ready in a few seconds.
        </p>
</div>
</div>
<!-- Saved Reel Metadata Capsule -->
<div class="pt-space-xs pb-space-md">
<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#F4EFEA] border border-[#E7E1D8] text-[#6B655D] max-w-full">
<span class="material-symbols-outlined text-[16px] text-[#D98A0B]">link</span>
<span class="font-caption text-caption truncate tracking-tight text-[#6B655D] font-medium">
          instagram.com/reel/C8xYz12
        </span>
</div>
</div>
<!-- Note Prompt Section -->
<div class="flex flex-col gap-2 pt-1 pb-space-md">
<label class="font-body-md text-meta-sm text-[#6B655D] font-medium" for="intent-note">
        Why are you saving this? <span class="text-[#9B948A] text-caption">(optional)</span>
</label>
<!-- Input Field -->
<div class="relative w-full">
<input class="w-full h-12 rounded-xl bg-[#FAF8F5] border border-[#E7E1D8] px-3.5 text-body-md font-body-md text-[#1C1A17] placeholder:text-[#9B948A] focus:outline-none focus:border-[#D98A0B] focus:ring-1 focus:ring-[#D98A0B] transition-colors" id="intent-note" placeholder="e.g. cafe to try in June" type="text">
</div>
<!-- Quick Context Chips -->
<div class="flex items-center gap-2 overflow-x-auto py-1 no-scrollbar -mx-margin px-margin">
<button class="tag-chip flex-shrink-0 px-3 py-1.5 rounded-full bg-[#F4EFEA] border border-[#E7E1D8] text-[#6B655D] font-caption text-caption hover:bg-[#eae2da] active:scale-95 transition-all" onclick="addTag(this, 'To try')" type="button">
          To try
        </button>
<button class="tag-chip flex-shrink-0 px-3 py-1.5 rounded-full bg-[#F4EFEA] border border-[#E7E1D8] text-[#6B655D] font-caption text-caption hover:bg-[#eae2da] active:scale-95 transition-all" onclick="addTag(this, 'To buy')" type="button">
          To buy
        </button>
<button class="tag-chip flex-shrink-0 px-3 py-1.5 rounded-full bg-[#F4EFEA] border border-[#E7E1D8] text-[#6B655D] font-caption text-caption hover:bg-[#eae2da] active:scale-95 transition-all" onclick="addTag(this, 'To visit')" type="button">
          To visit
        </button>
<button class="tag-chip flex-shrink-0 px-3 py-1.5 rounded-full bg-[#F4EFEA] border border-[#E7E1D8] text-[#6B655D] font-caption text-caption hover:bg-[#eae2da] active:scale-95 transition-all" onclick="addTag(this, 'To learn')" type="button">
          To learn
        </button>
<button class="tag-chip flex-shrink-0 px-3 py-1.5 rounded-full bg-[#F4EFEA] border border-[#E7E1D8] text-[#6B655D] font-caption text-caption hover:bg-[#eae2da] active:scale-95 transition-all" onclick="addTag(this, 'Watch later')" type="button">
          Watch later
        </button>
</div>
</div>
<!-- Actions Area -->
<div class="flex flex-col gap-2 pt-1">
<button class="w-full h-12 rounded-xl bg-[#D98A0B] text-[#FFFFFF] font-title-card text-title-card font-medium flex items-center justify-center tracking-wide active:opacity-90 shadow-sm transition-opacity" id="save-button" onclick="confirmSave()" type="button">
        Save note
      </button>
<button class="w-full h-10 flex items-center justify-center text-[#6B655D] font-body-md text-meta-sm hover:underline active:opacity-75 transition-opacity" onclick="dismissSheet()" type="button">
        Skip
      </button>
</div>
<!-- Auto-Dismiss Countdown Footer -->
<div class="w-full flex items-center justify-center pt-2">
<span class="font-caption text-caption text-[#9B948A]" id="countdown-label">Dismissed</span>
</div>
</div>
</div>
<script>
  let secondsRemaining = 3;
  const countdownEl = document.getElementById('countdown-label');
  const noteInput = document.getElementById('intent-note');
  let countdownTimer;

  function runCountdown() {
    countdownTimer = setInterval(() => {
      secondsRemaining -= 1;
      if (secondsRemaining > 0) {
        if (countdownEl) {
          countdownEl.textContent = `Closes in ${secondsRemaining} s`;
        }
      } else {
        clearInterval(countdownTimer);
        dismissSheet();
      }
    }, 1000);
  }

  function pauseCountdown() {
    if (countdownTimer) {
      clearInterval(countdownTimer);
      if (countdownEl) {
        countdownEl.textContent = 'Auto-dismiss paused';
      }
    }
  }

  function addTag(btn, label) {
    pauseCountdown();
    if (!noteInput) return;
    
    // Toggle behavior
    if (noteInput.value.includes(label)) {
      noteInput.value = noteInput.value.replace(label, '').replace(/,\s*,/g, ',').trim();
      btn.classList.remove('bg-[#D98A0B]', 'text-white', 'border-[#D98A0B]');
      btn.classList.add('bg-[#F4EFEA]', 'text-[#6B655D]', 'border-[#E7E1D8]');
    } else {
      noteInput.value = noteInput.value ? `${noteInput.value}, ${label}` : label;
      btn.classList.remove('bg-[#F4EFEA]', 'text-[#6B655D]', 'border-[#E7E1D8]');
      btn.classList.add('bg-[#D98A0B]', 'text-white', 'border-[#D98A0B]');
    }
  }

  if (noteInput) {
    noteInput.addEventListener('focus', pauseCountdown);
    noteInput.addEventListener('input', pauseCountdown);
  }

  function confirmSave() {
    pauseCountdown();
    const btn = document.getElementById('save-button');
    if (btn) {
      btn.textContent = 'Saved';
      btn.classList.remove('bg-[#D98A0B]');
      btn.classList.add('bg-stone-700', 'text-white');
      setTimeout(() => {
        dismissSheet();
      }, 400);
    }
  }

  function dismissSheet() {
    if (countdownEl) {
      countdownEl.textContent = 'Dismissed';
    }
  }

  runCountdown();
</script></main>
